name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Nightly full lint and unit suite before E2E and performance audits.
    - cron: '0 5 * * *'
  workflow_dispatch:

concurrency:
  # Keep merge pushes from cancelling the nightly full safety run.
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  checks: read
  contents: read
  pull-requests: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      quality: ${{ steps.classify.outputs.quality }}
      full_tests: ${{ steps.classify.outputs.full_tests }}
      full_lint: ${{ steps.classify.outputs.full_lint }}
      changed_tests: ${{ steps.classify.outputs.changed_tests }}
      quality_smoke_tests: ${{ steps.classify.outputs.quality_smoke_tests }}
      quality_label: ${{ steps.classify.outputs.quality_label }}
      migrations: ${{ steps.classify.outputs.migrations }}
      base_sha: ${{ steps.classify.outputs.base_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect pull-request-validated push
        id: pull-request
        if: github.event_name == 'push'
        uses: actions/github-script@v7
        with:
          script: |
            const { pathToFileURL } = require('node:url');
            const moduleUrl = pathToFileURL(
              `${process.env.GITHUB_WORKSPACE}/scripts/ci/detect-pull-request-validated-push.mjs`
            ).href;
            const { detectPullRequestValidatedPush } = await import(moduleUrl);
            const branch = context.ref.replace('refs/heads/', '');
            let validated = false;
            try {
              validated = await detectPullRequestValidatedPush({
                branch,
                commitSha: context.sha,
                listCheckRunsForRef: (parameters) =>
                  github.rest.checks.listForRef(parameters),
                listPullRequestsAssociatedWithCommit: (parameters) =>
                  github.rest.repos.listPullRequestsAssociatedWithCommit(parameters),
                owner: context.repo.owner,
                repo: context.repo.repo,
              });
            } catch (error) {
              core.warning(
                `Could not verify pull-request checks; retaining push CI: ${error.message}`
              );
            }
            core.setOutput('validated', String(validated));

      - name: Classify changes
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          VALIDATED_BY_PULL_REQUEST: ${{ steps.pull-request.outputs.validated || 'false' }}
        shell: bash
        run: bash scripts/ci/classify-changes.sh

  lint-and-test:
    name: Lint + test (${{ needs.changes.outputs.quality_label }})
    needs: changes
    if: needs.changes.outputs.quality == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Vitest --changed needs the pull request base commit.
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint all files
        if: needs.changes.outputs.full_lint == 'true'
        run: pnpm lint

      - name: Lint changed files
        if: needs.changes.outputs.full_lint != 'true'
        env:
          TEST_BASE_SHA: ${{ needs.changes.outputs.base_sha }}
          TEST_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          mapfile -d '' lint_files < <(
            git diff --name-only --diff-filter=ACMRTUXB -z \
              "$TEST_BASE_SHA" "$TEST_HEAD_SHA" -- \
              '*.js' '*.jsx' '*.ts' '*.tsx' '*.mjs' '*.cjs'
          )
          if (( ${#lint_files[@]} == 0 )); then
            echo "No changed JavaScript or TypeScript files to lint."
            exit 0
          fi
          pnpm exec eslint "${lint_files[@]}"

      - name: Typecheck full suite
        if: needs.changes.outputs.full_tests == 'true'
        run: pnpm typecheck

      - name: Test full suite
        if: needs.changes.outputs.full_tests == 'true' && github.event_name != 'schedule'
        run: pnpm test:run

      - name: Test full suite with coverage
        if: needs.changes.outputs.full_tests == 'true' && github.event_name == 'schedule'
        run: pnpm test:coverage

      - name: Test changed code
        if: needs.changes.outputs.changed_tests == 'true'
        env:
          TEST_BASE_SHA: ${{ needs.changes.outputs.base_sha }}
        run: pnpm test:run --changed="$TEST_BASE_SHA"

      - name: Test CI selectors
        if: needs.changes.outputs.full_tests != 'true' && needs.changes.outputs.quality_smoke_tests != ''
        env:
          QUALITY_SMOKE_TESTS: ${{ needs.changes.outputs.quality_smoke_tests }}
        shell: bash
        run: |
          IFS=',' read -ra smoke_tests <<< "$QUALITY_SMOKE_TESTS"
          pnpm exec vitest run "${smoke_tests[@]}"

  check-migrations:
    needs: changes
    if: needs.changes.outputs.migrations == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check for duplicate migration timestamps
        run: |
          echo "Checking for duplicate migration timestamps..."
          dupes=$(ls supabase/migrations/*.sql 2>/dev/null \
            | xargs -I{} basename {} \
            | cut -c1-14 \
            | sort \
            | uniq -d)
          if [ -n "$dupes" ]; then
            echo "❌ Duplicate migration timestamps found:"
            echo "$dupes"
            echo ""
            echo "Each migration file must have a unique timestamp prefix."
            echo "Use 'npx supabase migration new <name>' to generate unique timestamps."
            exit 1
          fi
          echo "✅ All migration timestamps are unique"

  pr-gate:
    name: PR Gate
    needs: [changes, lint-and-test, check-migrations]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Verify selected CI checks
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          QUALITY_NEEDED: ${{ needs.changes.outputs.quality }}
          QUALITY_RESULT: ${{ needs.lint-and-test.result }}
          MIGRATIONS_NEEDED: ${{ needs.changes.outputs.migrations }}
          MIGRATIONS_RESULT: ${{ needs.check-migrations.result }}
        shell: bash
        run: |
          set -euo pipefail
          test "$CHANGES_RESULT" = "success"
          if [[ "$QUALITY_NEEDED" == "true" ]]; then
            test "$QUALITY_RESULT" = "success"
          fi
          if [[ "$MIGRATIONS_NEEDED" == "true" ]]; then
            test "$MIGRATIONS_RESULT" = "success"
          fi
