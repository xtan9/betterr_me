name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test:run

  financial-safety-db-isolation:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # GitHub checks out a synthetic merge commit for pull requests by default.
      # Gate evidence must instead identify the immutable PR head being assessed.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - uses: supabase/setup-cli@v1
        with:
          version: 2.109.1
      - name: Start clean local Supabase and prove database readiness
        run: bash scripts/collect-financial-safety-ci-evidence.sh
      - name: Prove cross-household writes are denied
        run: |
          psql "$FINANCIAL_SAFETY_DB_URL" -v ON_ERROR_STOP=1 \
            -f supabase/tests/financial_safety_cushion_isolation.sql \
            | tee ci-evidence/postcondition.sql.out
      - name: Publish compact Gate 1 evidence to job summary
        if: ${{ always() }}
        run: |
          {
            echo '## Financial Safety Gate 1 DB isolation evidence'
            echo '```text'
            for evidence in ci-evidence/*; do
              [ -f "$evidence" ] || continue
              echo "== ${evidence#ci-evidence/} =="
              cat "$evidence"
            done
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Stop local Supabase
        if: ${{ always() }}
        run: supabase stop --no-backup || true

  financial-safety-local-production-smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - uses: supabase/setup-cli@v1
        with:
          version: 2.109.1
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Run isolated local production-mode partial Gate 1 smoke
        run: bash scripts/run-financial-safety-local-e2e.sh
      - name: Retain Financial Safety smoke failure artifacts
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: financial-safety-local-smoke-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: warn
          retention-days: 1
          compression-level: 9

  check-migrations:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for duplicate migration timestamps
        run: |
          echo "Checking for duplicate migration timestamps..."
          dupes=$(ls supabase/migrations/*.sql 2>/dev/null \
            | xargs -I{} basename {} \
            | cut -c1-14 \
            | sort \
            | uniq -d)
          if [ -n "$dupes" ]; then
            echo "❌ Duplicate migration timestamps found:"
            echo "$dupes"
            echo ""
            echo "Each migration file must have a unique timestamp prefix."
            echo "Use 'npx supabase migration new <name>' to generate unique timestamps."
            exit 1
          fi
          echo "✅ All migration timestamps are unique"
