name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Nightly at 06:00 UTC
    - cron: '0 6 * * *'

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require authenticated E2E secrets
        uses: ./.github/actions/check-secrets
        with:
          supabase-url: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          supabase-anon-key: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          e2e-email: ${{ secrets.E2E_TEST_EMAIL }}
          e2e-password: ${{ secrets.E2E_TEST_PASSWORD }}
          preview-url: ${{ secrets.E2E_PREVIEW_URL }}
          vercel-automation-bypass-secret: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          require-vercel-automation-bypass-secret: "true"

  e2e-tests:
    needs: check-secrets
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
      E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
      PLAYWRIGHT_BASE_URL: ${{ secrets.E2E_PREVIEW_URL }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: |
          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            npx playwright install --with-deps chromium firefox webkit
          else
            npx playwright install --with-deps chromium
          fi

      - name: Build application
        run: pnpm build

      - name: Run E2E tests
        run: pnpm test:e2e:chromium

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        # Retain large browser output only when an operator explicitly enables it.
        # The release gate retains a compact, sanitized manifest in CI instead.
        if: ${{ failure() && vars.RETAIN_LARGE_E2E_ARTIFACTS == 'true' }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 1
          compression-level: 9

  local-financial-cushion:
    if: ${{ github.event_name != 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.109.1

      - name: Start local Supabase
        run: supabase start

      - name: Reset local database with feature migration
        run: supabase db reset --local --yes --no-seed

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install --yes postgresql-client

      - name: Execute two-user finance cushion RLS fixture
        run: >-
          psql postgresql://postgres:postgres@127.0.0.1:54322/postgres
          -v ON_ERROR_STOP=1
          -f supabase/tests/finance_cushion_rls.sql

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure local authenticated E2E account
        shell: bash
        run: |
          export NEXT_PUBLIC_SUPABASE_URL="http://127.0.0.1:54321"
          echo "NEXT_PUBLIC_SUPABASE_URL=$NEXT_PUBLIC_SUPABASE_URL" >> "$GITHUB_ENV"
          anon_key="$(supabase status --output env | sed -n 's/^ANON_KEY=//p' | sed 's/^"//; s/"$//')"
          test -n "$anon_key"
          export NEXT_PUBLIC_SUPABASE_ANON_KEY="$anon_key"
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$anon_key" >> "$GITHUB_ENV"
          export E2E_TEST_EMAIL="cushion-e2e@example.test"
          echo "E2E_TEST_EMAIL=cushion-e2e@example.test" >> "$GITHUB_ENV"
          export E2E_TEST_PASSWORD="Cushion-E2E-local-2026!"
          echo "E2E_TEST_PASSWORD=Cushion-E2E-local-2026!" >> "$GITHUB_ENV"
          node --input-type=module <<'NODE'
          import { createClient } from '@supabase/supabase-js';

          const supabase = createClient(
            process.env.NEXT_PUBLIC_SUPABASE_URL,
            process.env.NEXT_PUBLIC_SUPABASE_ANON_KEY,
          );
          const { data, error } = await supabase.auth.signUp({
            email: process.env.E2E_TEST_EMAIL,
            password: process.env.E2E_TEST_PASSWORD,
          });
          if (error && !/already registered/i.test(error.message)) {
            throw error;
          }
          if (!data?.user) {
            const { error: signInError } = await supabase.auth.signInWithPassword({
              email: process.env.E2E_TEST_EMAIL,
              password: process.env.E2E_TEST_PASSWORD,
            });
            if (signInError) throw signInError;
          }
          NODE

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Build application
        run: pnpm build

      - name: Run local authenticated Cushion E2E
        run: pnpm exec playwright test e2e/financial-cushion.spec.ts --project=chromium --workers=1 --retries=0

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup
