name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Nightly at 06:00 UTC
    - cron: '0 6 * * *'

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      e2e: ${{ steps.classify.outputs.e2e }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Classify changes
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: bash scripts/ci/classify-changes.sh

  check-secrets:
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require authenticated E2E secrets outside pull requests
        if: ${{ github.event_name != 'pull_request' }}
        uses: ./.github/actions/check-secrets
        with:
          supabase-url: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          supabase-anon-key: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          e2e-email: ${{ secrets.E2E_TEST_EMAIL }}
          e2e-password: ${{ secrets.E2E_TEST_PASSWORD }}
          preview-url: ${{ secrets.E2E_PREVIEW_URL }}
          require-preview-url: ${{ github.event_name != 'pull_request' }}
          vercel-automation-bypass-secret: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          require-vercel-automation-bypass-secret: "true"
      - name: Confirm isolated pull-request verification contract
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          echo "Pull-request E2E uses a disposable local Supabase database."
          echo "Production Supabase secrets and E2E_PREVIEW_URL are not used for authenticated PR browser traffic."

  e2e-tests:
    needs: [changes, check-secrets]
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact pull-request checkout
        if: ${{ github.event_name == 'pull_request' }}
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          test "$actual_sha" = "$PR_HEAD_SHA"
          echo "Checked out exact pull-request head: $actual_sha"

      - name: Use configured preview deployment for non-pull-request E2E
        if: ${{ github.event_name != 'pull_request' }}
        shell: bash
        env:
          STATIC_PREVIEW_URL: ${{ secrets.E2E_PREVIEW_URL }}
        run: |
          set -euo pipefail
          printf 'PLAYWRIGHT_BASE_URL=%s\n' "$STATIC_PREVIEW_URL" >> "$GITHUB_ENV"
          echo "Using configured preview URL for $GITHUB_EVENT_NAME: $STATIC_PREVIEW_URL"

      - name: Setup disposable Supabase for pull-request E2E
        if: ${{ github.event_name == 'pull_request' }}
        uses: supabase/setup-cli@v1
        with:
          version: 2.109.1

      - name: Start disposable Supabase for pull-request E2E
        if: ${{ github.event_name == 'pull_request' }}
        run: supabase start

      - name: Reset disposable database with feature migration
        if: ${{ github.event_name == 'pull_request' }}
        run: supabase db reset --local --yes --no-seed

      - name: Install PostgreSQL client for pull-request RLS gate
        if: ${{ github.event_name == 'pull_request' }}
        run: sudo apt-get update && sudo apt-get install --yes postgresql-client

      - name: Prepare disposable authenticated E2E table grants
        if: ${{ github.event_name == 'pull_request' }}
        run: >-
          psql postgresql://postgres:postgres@127.0.0.1:54322/postgres
          -v ON_ERROR_STOP=1
          -f supabase/tests/e2e_local_authenticated_grants.sql

      - name: Execute two-user finance cushion RLS fixture
        if: ${{ github.event_name == 'pull_request' }}
        run: >-
          psql postgresql://postgres:postgres@127.0.0.1:54322/postgres
          -v ON_ERROR_STOP=1
          -f supabase/tests/finance_cushion_rls.sql

      - name: Execute opted-in Ralph SQL fixtures
        if: ${{ github.event_name == 'pull_request' }}
        run: bash scripts/ci/run-ralph-sql-tests.sh

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure disposable Supabase E2E target
        if: ${{ github.event_name == 'pull_request' }}
        shell: bash
        run: |
          set -euo pipefail
          printf 'PLAYWRIGHT_BASE_URL=\n' >> "$GITHUB_ENV"
          export NEXT_PUBLIC_SUPABASE_URL="http://127.0.0.1:54321"
          printf 'NEXT_PUBLIC_SUPABASE_URL=%s\n' "$NEXT_PUBLIC_SUPABASE_URL" >> "$GITHUB_ENV"
          anon_key="$(supabase status --output env | sed -n 's/^ANON_KEY=//p' | sed 's/^"//; s/"$//')"
          test -n "$anon_key"
          export NEXT_PUBLIC_SUPABASE_ANON_KEY="$anon_key"
          printf 'NEXT_PUBLIC_SUPABASE_ANON_KEY=%s\n' "$NEXT_PUBLIC_SUPABASE_ANON_KEY" >> "$GITHUB_ENV"
          export E2E_TEST_EMAIL="cushion-e2e@example.test"
          printf 'E2E_TEST_EMAIL=%s\n' "$E2E_TEST_EMAIL" >> "$GITHUB_ENV"
          export E2E_TEST_PASSWORD="Cushion-E2E-local-2026!"
          printf 'E2E_TEST_PASSWORD=%s\n' "$E2E_TEST_PASSWORD" >> "$GITHUB_ENV"
          node --input-type=module <<'NODE'
          import { createClient } from '@supabase/supabase-js';

          const supabase = createClient(
            process.env.NEXT_PUBLIC_SUPABASE_URL,
            process.env.NEXT_PUBLIC_SUPABASE_ANON_KEY,
          );
          const { data, error } = await supabase.auth.signUp({
            email: process.env.E2E_TEST_EMAIL,
            password: process.env.E2E_TEST_PASSWORD,
          });
          if (error && !/already registered/i.test(error.message)) {
            throw error;
          }
          if (!data?.user) {
            const { error: signInError } = await supabase.auth.signInWithPassword({
              email: process.env.E2E_TEST_EMAIL,
              password: process.env.E2E_TEST_PASSWORD,
            });
            if (signInError) throw signInError;
          }
          NODE

      - name: Configure production-backed E2E target
        if: ${{ github.event_name != 'pull_request' }}
        shell: bash
        env:
          PROD_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          PROD_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          PROD_E2E_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
          PROD_E2E_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
          VERCEL_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          set -euo pipefail
          printf 'NEXT_PUBLIC_SUPABASE_URL=%s\n' "$PROD_SUPABASE_URL" >> "$GITHUB_ENV"
          printf 'NEXT_PUBLIC_SUPABASE_ANON_KEY=%s\n' "$PROD_SUPABASE_ANON_KEY" >> "$GITHUB_ENV"
          printf 'E2E_TEST_EMAIL=%s\n' "$PROD_E2E_EMAIL" >> "$GITHUB_ENV"
          printf 'E2E_TEST_PASSWORD=%s\n' "$PROD_E2E_PASSWORD" >> "$GITHUB_ENV"
          printf 'VERCEL_AUTOMATION_BYPASS_SECRET=%s\n' "$VERCEL_BYPASS_SECRET" >> "$GITHUB_ENV"

      - name: Install Playwright browsers
        run: |
          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            npx playwright install --with-deps chromium firefox webkit
          else
            npx playwright install --with-deps chromium
          fi

      - name: Build application
        run: pnpm build

      - name: Run E2E tests
        run: pnpm test:e2e:chromium

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        # Retain large browser output only when an operator explicitly enables it.
        # The release gate retains a compact, sanitized manifest in CI instead.
        if: ${{ failure() && vars.RETAIN_LARGE_E2E_ARTIFACTS == 'true' }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 1
          compression-level: 9

      - name: Stop disposable Supabase
        if: ${{ always() && github.event_name == 'pull_request' }}
        run: supabase stop --no-backup
