name: E2E Tests

on:
  pull_request:
    branches: [main]
  schedule:
    # Nightly at 06:00 UTC
    - cron: '0 6 * * *'

concurrency:
  group: e2e-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect E2E scope
    runs-on: ubuntu-latest
    outputs:
      classification_json: ${{ steps.classify.outputs.classification_json }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Classify changes
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/ci/run-change-classifier.mjs

  e2e-tests:
    name: E2E (${{ fromJSON(needs.changes.outputs.classification_json).labels.e2e }})
    needs: changes
    if: fromJSON(needs.changes.outputs.classification_json).suites.e2e
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact pull-request checkout
        if: ${{ github.event_name == 'pull_request' }}
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          test "$actual_sha" = "$PR_HEAD_SHA"
          echo "Checked out exact pull-request head: $actual_sha"

      - name: Require authenticated E2E secrets outside pull requests
        if: ${{ github.event_name != 'pull_request' }}
        uses: ./.github/actions/check-secrets
        with:
          supabase-url: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          supabase-anon-key: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          e2e-email: ${{ secrets.E2E_TEST_EMAIL }}
          e2e-password: ${{ secrets.E2E_TEST_PASSWORD }}

      - name: Setup disposable Supabase for pull-request E2E
        if: ${{ github.event_name == 'pull_request' && fromJSON(needs.changes.outputs.classification_json).suites.e2eSupabase }}
        uses: supabase/setup-cli@v1
        with:
          version: 2.109.1

      - name: Start disposable Supabase and apply migrations
        if: ${{ github.event_name == 'pull_request' && fromJSON(needs.changes.outputs.classification_json).suites.e2eSupabase }}
        run: >-
          supabase start
          --exclude analytics,edge-runtime,functions,imgproxy,inbucket,meta,storage,studio,vector

      - name: Install PostgreSQL client for pull-request RLS gate
        if: ${{ github.event_name == 'pull_request' && fromJSON(needs.changes.outputs.classification_json).suites.e2eSupabase }}
        run: sudo apt-get update && sudo apt-get install --yes postgresql-client

      - name: Prepare disposable authenticated E2E table grants
        if: ${{ github.event_name == 'pull_request' && fromJSON(needs.changes.outputs.classification_json).suites.e2eSupabase }}
        run: >-
          psql postgresql://postgres:postgres@127.0.0.1:54322/postgres
          -v ON_ERROR_STOP=1
          -f supabase/tests/e2e_local_authenticated_grants.sql

      - name: Execute two-user finance cushion RLS fixture
        if: ${{ github.event_name == 'pull_request' && fromJSON(needs.changes.outputs.classification_json).suites.e2eSupabase }}
        run: >-
          psql postgresql://postgres:postgres@127.0.0.1:54322/postgres
          -v ON_ERROR_STOP=1
          -f supabase/tests/finance_cushion_rls.sql

      - name: Execute opted-in Ralph SQL fixtures
        if: ${{ github.event_name == 'pull_request' && fromJSON(needs.changes.outputs.classification_json).suites.e2eSupabase }}
        run: bash scripts/ci/run-ralph-sql-tests.sh

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore Next.js build cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-e2e-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-nextjs-e2e-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Configure disposable Supabase E2E target
        if: ${{ github.event_name == 'pull_request' && fromJSON(needs.changes.outputs.classification_json).suites.e2eSupabase }}
        shell: bash
        run: |
          set -euo pipefail
          printf 'PLAYWRIGHT_BASE_URL=\n' >> "$GITHUB_ENV"
          export NEXT_PUBLIC_SUPABASE_URL="http://127.0.0.1:54321"
          printf 'NEXT_PUBLIC_SUPABASE_URL=%s\n' "$NEXT_PUBLIC_SUPABASE_URL" >> "$GITHUB_ENV"
          anon_key="$(supabase status --output env | sed -n 's/^ANON_KEY=//p' | sed 's/^"//; s/"$//')"
          test -n "$anon_key"
          export NEXT_PUBLIC_SUPABASE_ANON_KEY="$anon_key"
          printf 'NEXT_PUBLIC_SUPABASE_ANON_KEY=%s\n' "$NEXT_PUBLIC_SUPABASE_ANON_KEY" >> "$GITHUB_ENV"
          export E2E_TEST_EMAIL="cushion-e2e@example.test"
          printf 'E2E_TEST_EMAIL=%s\n' "$E2E_TEST_EMAIL" >> "$GITHUB_ENV"
          export E2E_TEST_PASSWORD="Cushion-E2E-local-2026!"
          printf 'E2E_TEST_PASSWORD=%s\n' "$E2E_TEST_PASSWORD" >> "$GITHUB_ENV"
          node --input-type=module <<'NODE'
          import { createClient } from '@supabase/supabase-js';

          const supabase = createClient(
            process.env.NEXT_PUBLIC_SUPABASE_URL,
            process.env.NEXT_PUBLIC_SUPABASE_ANON_KEY,
          );
          const { data, error } = await supabase.auth.signUp({
            email: process.env.E2E_TEST_EMAIL,
            password: process.env.E2E_TEST_PASSWORD,
          });
          if (error && !/already registered/i.test(error.message)) {
            throw error;
          }
          if (!data?.user) {
            const { error: signInError } = await supabase.auth.signInWithPassword({
              email: process.env.E2E_TEST_EMAIL,
              password: process.env.E2E_TEST_PASSWORD,
            });
            if (signInError) throw signInError;
          }
          NODE

      - name: Configure production-backed E2E target
        if: ${{ github.event_name != 'pull_request' }}
        shell: bash
        env:
          PROD_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          PROD_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          PROD_E2E_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
          PROD_E2E_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
        run: |
          set -euo pipefail
          printf 'PLAYWRIGHT_BASE_URL=\n' >> "$GITHUB_ENV"
          printf 'NEXT_PUBLIC_SUPABASE_URL=%s\n' "$PROD_SUPABASE_URL" >> "$GITHUB_ENV"
          printf 'NEXT_PUBLIC_SUPABASE_ANON_KEY=%s\n' "$PROD_SUPABASE_ANON_KEY" >> "$GITHUB_ENV"
          printf 'E2E_TEST_EMAIL=%s\n' "$PROD_E2E_EMAIL" >> "$GITHUB_ENV"
          printf 'E2E_TEST_PASSWORD=%s\n' "$PROD_E2E_PASSWORD" >> "$GITHUB_ENV"

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build application
        run: pnpm build

      - name: Run E2E tests
        env:
          E2E_FULL: ${{ fromJSON(needs.changes.outputs.classification_json).suites.e2eFull }}
          E2E_SPECS: ${{ join(fromJSON(needs.changes.outputs.classification_json).suites.e2eSpecs, ',') }}
          E2E_RUNWAY: ${{ fromJSON(needs.changes.outputs.classification_json).suites.e2eRunway }}
          E2E_VISUAL: ${{ fromJSON(needs.changes.outputs.classification_json).suites.e2eVisual }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$E2E_FULL" == "true" ]]; then
            pnpm test:e2e:chromium
          elif [[ -n "$E2E_SPECS" ]]; then
            IFS=',' read -r -a specs <<< "$E2E_SPECS"
            pnpm exec playwright test "${specs[@]}" --project=chromium
          fi

          if [[ "$E2E_RUNWAY" == "true" ]]; then
            pnpm exec playwright test e2e/financial-cushion.spec.ts --project=runway-public-desktop
          fi

          if [[ "$E2E_VISUAL" == "true" ]]; then
            pnpm exec playwright test e2e/visual-regression.spec.ts --project=visual-regression
          fi

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-failure-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 3
          compression-level: 9

  pr-gate:
    name: PR Gate
    needs: [changes, e2e-tests]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Verify selected E2E checks
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          E2E_NEEDED: ${{ fromJSON(needs.changes.outputs.classification_json).suites.e2e }}
          E2E_RESULT: ${{ needs.e2e-tests.result }}
        shell: bash
        run: |
          set -euo pipefail
          test "$CHANGES_RESULT" = "success"
          if [[ "$E2E_NEEDED" == "true" ]]; then
            test "$E2E_RESULT" = "success"
          fi
