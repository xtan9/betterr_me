name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Nightly at 06:00 UTC
    - cron: '0 6 * * *'
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect E2E scope
    runs-on: ubuntu-latest
    outputs:
      classification_json: ${{ steps.classify.outputs.classification_json }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Classify changes
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/ci/run-change-classifier.mjs

  e2e-tests:
    name: E2E (${{ fromJSON(needs.changes.outputs.classification_json).labels.e2e }})
    needs: changes
    if: fromJSON(needs.changes.outputs.classification_json).suites.e2e
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact pull-request checkout
        if: ${{ github.event_name == 'pull_request' }}
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          test "$actual_sha" = "$PR_HEAD_SHA"
          echo "Checked out exact pull-request head: $actual_sha"

      - name: Require authenticated E2E secrets outside pull requests
        if: ${{ github.event_name != 'pull_request' }}
        uses: ./.github/actions/check-secrets
        with:
          supabase-url: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          supabase-anon-key: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          e2e-email: ${{ secrets.E2E_TEST_EMAIL }}
          e2e-password: ${{ secrets.E2E_TEST_PASSWORD }}

      - name: Setup disposable Supabase for pull-request E2E
        if: ${{ github.event_name == 'pull_request' && fromJSON(needs.changes.outputs.classification_json).suites.e2eSupabase }}
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3
        with:
          version: 2.109.1

      - name: Start disposable Supabase and apply migrations
        if: ${{ github.event_name == 'pull_request' && fromJSON(needs.changes.outputs.classification_json).suites.e2eSupabase }}
        run: >-
          supabase start
          --exclude analytics,edge-runtime,functions,imgproxy,inbucket,meta,storage,studio,vector

      - name: Install PostgreSQL client for pull-request RLS gate
        if: ${{ github.event_name == 'pull_request' && fromJSON(needs.changes.outputs.classification_json).suites.e2eSupabase }}
        run: sudo apt-get update && sudo apt-get install --yes postgresql-client

      - name: Prepare disposable authenticated E2E table grants
        if: ${{ github.event_name == 'pull_request' && fromJSON(needs.changes.outputs.classification_json).suites.e2eSupabase }}
        run: >-
          psql postgresql://postgres:postgres@127.0.0.1:54322/postgres
          -v ON_ERROR_STOP=1
          -f supabase/tests/e2e_local_authenticated_grants.sql

      - name: Execute registered SQL acceptance fixtures
        if: ${{ github.event_name == 'pull_request' && fromJSON(needs.changes.outputs.classification_json).suites.e2eSupabase }}
        run: bash scripts/ci/run-sql-fixtures.sh

      - name: Verify SQL fixture runner failure diagnostics
        if: ${{ github.event_name == 'pull_request' && fromJSON(needs.changes.outputs.classification_json).suites.e2eSupabase }}
        run: bash scripts/ci/verify-sql-fixture-runner.sh

      - name: Upload SQL fixture diagnostics
        if: ${{ failure() && github.event_name == 'pull_request' && fromJSON(needs.changes.outputs.classification_json).suites.e2eSupabase }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sql-fixture-failure-${{ github.run_id }}
          path: ${{ runner.temp }}/sql-fixtures/
          if-no-files-found: warn
          retention-days: 3
          compression-level: 9

      - name: Setup Node.js, pnpm, and dependencies
        uses: ./.github/actions/setup-node-pnpm

      - name: Restore Next.js build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-e2e-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-nextjs-e2e-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Configure disposable Supabase E2E target
        if: ${{ github.event_name == 'pull_request' && fromJSON(needs.changes.outputs.classification_json).suites.e2eSupabase }}
        shell: bash
        run: |
          set -euo pipefail
          printf 'PLAYWRIGHT_BASE_URL=\n' >> "$GITHUB_ENV"
          export NEXT_PUBLIC_SUPABASE_URL="http://127.0.0.1:54321"
          printf 'NEXT_PUBLIC_SUPABASE_URL=%s\n' "$NEXT_PUBLIC_SUPABASE_URL" >> "$GITHUB_ENV"
          anon_key="$(supabase status --output env | sed -n 's/^ANON_KEY=//p' | sed 's/^"//; s/"$//')"
          test -n "$anon_key"
          export NEXT_PUBLIC_SUPABASE_ANON_KEY="$anon_key"
          printf 'NEXT_PUBLIC_SUPABASE_ANON_KEY=%s\n' "$NEXT_PUBLIC_SUPABASE_ANON_KEY" >> "$GITHUB_ENV"
          service_role_key="$(supabase status --output env | sed -n 's/^SERVICE_ROLE_KEY=//p' | sed 's/^"//; s/"$//')"
          test -n "$service_role_key"
          printf 'E2E_SUPABASE_SERVICE_ROLE_KEY=%s\n' "$service_role_key" >> "$GITHUB_ENV"
          export E2E_RUN_ID="gh-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          printf 'E2E_RUN_ID=%s\n' "$E2E_RUN_ID" >> "$GITHUB_ENV"
          printf 'E2E_DATA_MODE=disposable\n' >> "$GITHUB_ENV"
          export E2E_TEST_EMAIL="cushion-e2e@example.test"
          printf 'E2E_TEST_EMAIL=%s\n' "$E2E_TEST_EMAIL" >> "$GITHUB_ENV"
          export E2E_TEST_PASSWORD="Cushion-E2E-local-2026!"
          printf 'E2E_TEST_PASSWORD=%s\n' "$E2E_TEST_PASSWORD" >> "$GITHUB_ENV"

      - name: Configure production-backed E2E target
        if: ${{ github.event_name != 'pull_request' }}
        shell: bash
        env:
          PROD_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          PROD_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          PROD_E2E_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
          PROD_E2E_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
        run: |
          set -euo pipefail
          printf 'PLAYWRIGHT_BASE_URL=\n' >> "$GITHUB_ENV"
          printf 'NEXT_PUBLIC_SUPABASE_URL=%s\n' "$PROD_SUPABASE_URL" >> "$GITHUB_ENV"
          printf 'NEXT_PUBLIC_SUPABASE_ANON_KEY=%s\n' "$PROD_SUPABASE_ANON_KEY" >> "$GITHUB_ENV"
          printf 'E2E_TEST_EMAIL=%s\n' "$PROD_E2E_EMAIL" >> "$GITHUB_ENV"
          printf 'E2E_TEST_PASSWORD=%s\n' "$PROD_E2E_PASSWORD" >> "$GITHUB_ENV"
          printf 'E2E_RUN_ID=gh-%s-%s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
          printf 'E2E_DATA_MODE=read-only\n' >> "$GITHUB_ENV"

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build application
        run: pnpm build

      - name: Run E2E tests
        env:
          E2E_FULL: ${{ fromJSON(needs.changes.outputs.classification_json).suites.e2eFull }}
          E2E_SPECS: ${{ join(fromJSON(needs.changes.outputs.classification_json).suites.e2eSpecs, ',') }}
          E2E_RUNWAY: ${{ fromJSON(needs.changes.outputs.classification_json).suites.e2eRunway }}
          E2E_VISUAL: ${{ fromJSON(needs.changes.outputs.classification_json).suites.e2eVisual }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${E2E_DATA_MODE:-read-only}" == "read-only" ]]; then
            pnpm exec playwright test e2e/production-smoke.spec.ts --project=chromium
            exit 0
          fi

          if [[ "$E2E_FULL" == "true" ]]; then
            pnpm test:e2e:chromium
          elif [[ -n "$E2E_SPECS" ]]; then
            IFS=',' read -r -a specs <<< "$E2E_SPECS"
            pnpm exec playwright test "${specs[@]}" --project=chromium
          fi

          if [[ "$E2E_RUNWAY" == "true" ]]; then
            # Household Runway has a dedicated anonymous project. Do not pull
            # the authenticated setup project into this public-only check.
            pnpm exec playwright test e2e/financial-cushion.spec.ts --project=runway-public-desktop --no-deps
          fi

          if [[ "$E2E_VISUAL" == "true" ]]; then
            pnpm exec playwright test e2e/visual-regression.spec.ts --project=visual-regression
          fi

      - name: Upload Playwright report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: failure()
        with:
          name: playwright-failure-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 3
          compression-level: 9

  e2e-gate:
    name: E2E Gate
    needs: [changes, e2e-tests]
    if: always() && (github.event_name == 'pull_request' || github.event_name == 'push')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout gate policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Verify selected E2E checks
        env:
          GATE_NAME: E2E Gate
          SELECTION_RESULT: ${{ needs.changes.result }}
          CLASSIFICATION_JSON: ${{ needs.changes.outputs.classification_json }}
          PREREQUISITES_JSON: >-
            [{"name":"browser tests","suite":"e2e","result":"${{ needs.e2e-tests.result }}"}]
        run: node scripts/ci/verify-gate.mjs
