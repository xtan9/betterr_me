name: Dispatch Reminders

on:
  schedule:
    - cron: "* * * * *"
  workflow_dispatch: {}

concurrency:
  group: dispatch-reminders
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch pending reminders
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl --fail --silent --show-error \
            --retry 2 --retry-all-errors --max-time 60 \
            -X GET "${APP_URL}/api/cron/dispatch-reminders" \
            -H "Authorization: Bearer ${CRON_SECRET}"
