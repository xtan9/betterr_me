name: Dispatch Reminders

on:
  schedule:
    - cron: "* * * * *"
  workflow_dispatch: {}

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch pending reminders
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl -sf -X GET "${APP_URL}/api/cron/dispatch-reminders" \
            -H "Authorization: Bearer ${CRON_SECRET}"
