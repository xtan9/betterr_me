name: Mutation Testing

on:
  pull_request:
    branches: [main]
    paths:
      - "lib/db/**"
      - "lib/recurring-tasks/**"
      - "tests/lib/db/**"
      - "tests/lib/recurring-tasks/**"
      - "tests/helpers/mock-supabase.ts"
      - "tests/setup.ts"
      - "stryker.config.mjs"
      # Mutation infra itself — a change here must re-run the gate to catch
      # regressions (e.g. a broken --mutate filter that silently mutates 0 files).
      - "scripts/stryker-changed.mjs"
      - ".github/workflows/mutation-testing.yml"
      - "package.json"
      - "pnpm-workspace.yaml"
  schedule:
    # Mondays at 03:00 UTC — full baseline on main, catches cross-file drift
    # a per-PR changed-files run would miss.
    - cron: "0 3 * * 1"
  workflow_dispatch: {}

concurrency:
  # Mutation runs are advisory and infrequent. Preserve an in-flight baseline
  # instead of replacing it with a newer run that has no diagnostic history.
  group: mutation-testing-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Per-PR: only mutate files changed vs origin/main. Typical runtime 2-5 min.
  mutation-changed:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Need full history so the diff vs origin/main works.
          fetch-depth: 0

      - name: Fetch base ref
        run: git fetch origin main:refs/remotes/origin/main

      - name: Setup Node.js, pnpm, and dependencies
        uses: ./.github/actions/setup-node-pnpm

      - name: Run Stryker on changed files
        run: pnpm mutation-test:changed

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mutation-report-pr
          path: reports/mutation/
          if-no-files-found: ignore
          retention-days: 14

  # Weekly + manual: full mutation run. Catches cross-file regressions a
  # per-PR changed-files run would miss (e.g. a change to tests/helpers/ that
  # weakens tests in un-changed DB files).
  mutation-full:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js, pnpm, and dependencies
        uses: ./.github/actions/setup-node-pnpm

      - name: Run full Stryker
        id: full-mutation
        # The command reports its own 50-minute timeout. The wider step and job
        # limits reserve time for process cleanup, diagnostics, and artifacts.
        timeout-minutes: 52
        shell: bash
        run: |
          set +e
          timeout --signal=TERM --kill-after=30s 50m pnpm mutation-test
          mutation_status=$?
          set -e

          if [[ "$mutation_status" -eq 0 ]]; then
            conclusion="success"
          elif [[ "$mutation_status" -eq 124 || "$mutation_status" -eq 137 ]]; then
            conclusion="timed_out"
          else
            conclusion="failure"
          fi

          echo "conclusion=$conclusion" >> "$GITHUB_OUTPUT"
          exit "$mutation_status"

      - name: Publish full mutation diagnostic
        if: always()
        env:
          MUTATION_CONCLUSION: ${{ steps.full-mutation.outputs.conclusion }}
          MUTATION_OUTCOME: ${{ steps.full-mutation.outcome }}
          RUN_CANCELLED: ${{ cancelled() }}
        run: node scripts/ci/scheduled-workflow-diagnostic.mjs

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mutation-report-full
          path: reports/mutation/
          if-no-files-found: ignore
          retention-days: 30
