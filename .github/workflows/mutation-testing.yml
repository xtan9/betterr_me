name: Mutation Testing

on:
  pull_request:
    branches: [main]
    paths:
      - "lib/db/**"
      - "lib/recurring-tasks/**"
      - "tests/lib/db/**"
      - "tests/lib/recurring-tasks/**"
      - "tests/helpers/mock-supabase.ts"
      - "tests/setup.ts"
      - "stryker.config.mjs"
      # Mutation infra itself — a change here must re-run the gate to catch
      # regressions (e.g. a broken --mutate filter that silently mutates 0 files).
      - "scripts/stryker-changed.mjs"
      - ".github/workflows/mutation-testing.yml"
      - "package.json"
  schedule:
    # Mondays at 03:00 UTC — full baseline on main, catches cross-file drift
    # a per-PR changed-files run would miss.
    - cron: "0 3 * * 1"
  workflow_dispatch: {}

jobs:
  # Per-PR: only mutate files changed vs origin/main. Typical runtime 2-5 min.
  mutation-changed:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Need full history so the diff vs origin/main works.
          fetch-depth: 0

      - name: Fetch base ref
        run: git fetch origin main:refs/remotes/origin/main

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Stryker on changed files
        run: pnpm mutation-test:changed

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report-pr
          path: reports/mutation/
          if-no-files-found: ignore
          retention-days: 14

  # Weekly + manual: full mutation run. Catches cross-file regressions a
  # per-PR changed-files run would miss (e.g. a change to tests/helpers/ that
  # weakens tests in un-changed DB files).
  mutation-full:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run full Stryker
        run: pnpm mutation-test

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report-full
          path: reports/mutation/
          if-no-files-found: ignore
          retention-days: 30
