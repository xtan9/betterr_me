name: Prewarm Recurring Task Coverage

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch: {}

concurrency:
  group: prewarm-recurring-task-coverage
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prewarm:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Prewarm Active Series coverage
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl --fail --silent --show-error \
            --retry 2 --retry-all-errors --max-time 60 \
            -X GET "${APP_URL}/api/cron/prewarm-recurring-tasks" \
            -H "Authorization: Bearer ${CRON_SECRET}"
