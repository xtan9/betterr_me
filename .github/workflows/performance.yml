name: Performance Measurements (Advisory)

on:
  pull_request:
    branches: [main]
  schedule:
    # Nightly full measurement at 07:00 UTC.
    - cron: '0 7 * * *'
  workflow_dispatch:

concurrency:
  group: performance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      classification_json: ${{ steps.classify.outputs.classification_json }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Classify changes
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/ci/run-change-classifier.mjs

  check-secrets:
    needs: changes
    if: fromJSON(needs.changes.outputs.classification_json).suites.performance
    runs-on: ubuntu-latest
    outputs:
      has-secrets: ${{ steps.check.outputs.has-secrets }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Check required secrets
        id: check
        uses: ./.github/actions/check-secrets
        with:
          supabase-url: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          supabase-anon-key: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          e2e-email: ${{ secrets.E2E_TEST_EMAIL }}
          e2e-password: ${{ secrets.E2E_TEST_PASSWORD }}
          preview-url: ${{ secrets.E2E_PREVIEW_URL }}
          require-preview-url: "true"

  lighthouse:
    name: Bundle and Lighthouse budgets (advisory)
    needs: [changes, check-secrets]
    if: ${{ fromJSON(needs.changes.outputs.classification_json).suites.performance && needs.check-secrets.outputs.has-secrets == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
      E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
      # PRs favor a one-sample smoke measurement; nightly/manual runs collect
      # three samples across the full URL set. See docs/quality-signals.md.
      LHCI_NUMBER_OF_RUNS: ${{ github.event_name == 'pull_request' && '1' || '3' }}
      LHCI_SMOKE_ONLY: ${{ github.event_name == 'pull_request' && 'true' || 'false' }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js, pnpm, and dependencies
        uses: ./.github/actions/setup-node-pnpm

      - name: Build application
        run: pnpm build

      - name: Analyze bundle size
        run: pnpm perf:bundle

      - name: Measure Lighthouse budgets
        uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # v12
        with:
          configPath: './lighthouserc.js'
          uploadArtifacts: false
          temporaryPublicStorage: false
