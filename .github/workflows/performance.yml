name: Performance Audit

on:
  pull_request:
    branches: [main]
  schedule:
    # Nightly full audit at 07:00 UTC.
    - cron: '0 7 * * *'
  workflow_dispatch:

concurrency:
  group: performance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      performance: ${{ steps.classify.outputs.performance }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Classify changes
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: bash scripts/ci/classify-changes.sh

  check-secrets:
    needs: changes
    if: needs.changes.outputs.performance == 'true'
    runs-on: ubuntu-latest
    outputs:
      has-secrets: ${{ steps.check.outputs.has-secrets }}
    steps:
      - uses: actions/checkout@v4
      - name: Check required secrets
        id: check
        uses: ./.github/actions/check-secrets
        with:
          supabase-url: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          supabase-anon-key: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          e2e-email: ${{ secrets.E2E_TEST_EMAIL }}
          e2e-password: ${{ secrets.E2E_TEST_PASSWORD }}
          preview-url: ${{ secrets.E2E_PREVIEW_URL }}
          require-preview-url: "true"

  lighthouse:
    needs: [changes, check-secrets]
    if: ${{ needs.changes.outputs.performance == 'true' && needs.check-secrets.outputs.has-secrets == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
      E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
      # PRs favor a fast smoke audit; nightly/manual runs retain the full baseline.
      LHCI_NUMBER_OF_RUNS: ${{ github.event_name == 'pull_request' && '1' || '3' }}
      LHCI_SMOKE_ONLY: ${{ github.event_name == 'pull_request' && 'true' || 'false' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build application
        run: pnpm build

      - name: Analyze bundle size
        run: pnpm perf:bundle

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: './lighthouserc.js'
          uploadArtifacts: false
          temporaryPublicStorage: false
