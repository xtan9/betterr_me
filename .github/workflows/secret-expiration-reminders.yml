name: Secret Expiration Reminders

on:
  schedule:
    - cron: "23 16 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: secret-expiration-reminders
  cancel-in-progress: false

jobs:
  reconcile-reminder:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout trusted default-branch metadata
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Create, update, or close the expiration reminder
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/ci/reconcile-secret-expiration-issue.mjs
