name: Check Secrets
description: Check if required Supabase and E2E secrets are configured

inputs:
  supabase-url:
    description: NEXT_PUBLIC_SUPABASE_URL secret value
    required: true
  supabase-anon-key:
    description: NEXT_PUBLIC_SUPABASE_ANON_KEY secret value
    required: true
  e2e-email:
    description: E2E_TEST_EMAIL secret value
    required: true
  e2e-password:
    description: E2E_TEST_PASSWORD secret value
    required: true
  preview-url:
    description: Authenticated Preview URL for the exact commit under test
    required: true
  vercel-automation-bypass-secret:
    description: Vercel Deployment Protection bypass secret for authenticated Preview tests
    required: true

outputs:
  has-secrets:
    description: Whether all required secrets are configured
    value: ${{ steps.check.outputs.has-secrets }}

runs:
  using: composite
  steps:
    - name: Check required secrets
      id: check
      shell: bash
      env:
        SUPABASE_URL: ${{ inputs.supabase-url }}
        SUPABASE_ANON_KEY: ${{ inputs.supabase-anon-key }}
        E2E_EMAIL: ${{ inputs.e2e-email }}
        E2E_PASSWORD: ${{ inputs.e2e-password }}
        PREVIEW_URL: ${{ inputs.preview-url }}
        VERCEL_AUTOMATION_BYPASS_SECRET: ${{ inputs.vercel-automation-bypass-secret }}
      run: |
        if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ] || \
           [ -z "$E2E_EMAIL" ] || [ -z "$E2E_PASSWORD" ] || [ -z "$PREVIEW_URL" ] || \
           [ -z "$VERCEL_AUTOMATION_BYPASS_SECRET" ]; then
          echo "::error::Authenticated E2E secrets are required; refusing to skip this release gate."
          exit 1
        else
          echo "has-secrets=true" >> "$GITHUB_OUTPUT"
        fi
