name: Setup Node.js, pnpm, and dependencies
description: Install the repository's pinned pnpm and Node.js toolchain

inputs:
  install-dependencies:
    description: Install the frozen dependency graph after setting up Node.js and pnpm
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Setup pnpm
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6

    - name: Setup Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
      with:
        node-version: 24
        package-manager-cache: ${{ inputs.install-dependencies }}
        cache: ${{ inputs.install-dependencies == 'true' && 'pnpm' || '' }}

    - name: Install dependencies
      if: inputs.install-dependencies == 'true'
      shell: bash
      run: pnpm install --frozen-lockfile
